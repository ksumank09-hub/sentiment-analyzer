services:
  - type: web
    name: sentiment-analyzer
    runtime: python
    plan: free
    # The model is re-trained during the build so it always matches the
    # scikit-learn version installed on the server.
    buildCommand: pip install -r requirements-deploy.txt && python -m src.train
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
